# This is a Declarative Automation Bundle definition for databricks_claude_jornadaDados_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_claude_jornadaDados_project
  uuid: c01088d8-6dde-4713-8056-aa1f1f488960

include:
  - resources/*.yml

# The catalog is the ONLY thing that differs between environments, and it is decided
# here, per target. Never hardcode a catalog name in any other file:
#   - YAML resources use ${var.catalog}
#   - pipeline SQL uses ${medallion_catalog} (pipeline configuration)
variables:
  catalog:
    description: The Unity Catalog catalog that holds the bronze/silver/gold schemas
  warehouse_id:
    description: SQL warehouse used by the AI/BI dashboard
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a0a7238f-b942.cloud.databricks.com
    variables:
      catalog: workspace
  prod:
    mode: production
    workspace:
      host: https://dbc-a0a7238f-b942.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/joaofantini01@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/joaofantini01@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
    permissions:
      - user_name: joaofantini01@gmail.com
        level: CAN_MANAGE
